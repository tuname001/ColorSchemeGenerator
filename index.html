                    this.dom.modeSplit.style.backgroundColor = '';
                }
                this.updateBackground();
                if (recordHistory) {
                    this.pushHistory(this.currentColors);
                }
                this.saveState();
            }

            updateSubModes() {
                const mainVal = this.dom.mainMode.value;
                const prevSubVal = this.dom.subMode.value;
                const count = parseInt(this.dom.colorCountSlider.value);
                this.dom.subMode.innerHTML = '';

                if (mainVal === 'hue_tone') {
                    this.dom.subMode.classList.add('hidden');
                    this.dom.hueToneSettings.classList.remove('hidden');
                    if (this.dom.resetCategoryBtn) this.dom.resetCategoryBtn.classList.remove('hidden');
                } else {
                    if (this.dom.resetCategoryBtn) this.dom.resetCategoryBtn.classList.add('hidden');
                    this.dom.subMode.classList.remove('hidden');
                    this.dom.hueToneSettings.classList.add('hidden');

                    const options = CONFIG.SUB_MODES[mainVal] || [];
                    
                    // 固定色数系サブカテゴリのマッピング定義（ダイアード ↔ トライアド ↔ テトラード ↔ ペンタード ↔ ヘクサード）
                    const countBasedSubModes = {
                        2: 'dyad',
                        3: 'triad',
                        4: 'tetrad',
                        5: 'pentad',
                        6: 'hexad'
                    };
                    const fixedCountValues = Object.values(countBasedSubModes);

                    let targetSubVal = prevSubVal;
                    // ユーザーが「ダイアードやトライアドなど」を選択中で、スライダー等で色数を変更した場合
                    if (fixedCountValues.includes(prevSubVal) && countBasedSubModes[count]) {
                        targetSubVal = countBasedSubModes[count]; // 変更後の色数に対応するサブカテゴリへ自動切替
                    }

                    options.forEach(opt => {
                        // targetCountが指定されている場合は、現在の色数と一致するものだけを表示する
                        if (opt.targetCount && opt.targetCount !== count) return;
                        const el = document.createElement('option');
                        el.value = opt.value;
                        const t = this.translations[this.currentLang];
                        el.textContent = (t.subModes && t.subModes[opt.value]) ? t.subModes[opt.value] : opt.label;
                        this.dom.subMode.appendChild(el);
                    });

                    // 自動切替先のサブカテゴリが新しいリスト内に存在すればそれを選択、なければ以前のものを維持
                    if (targetSubVal && Array.from(this.dom.subMode.options).some(opt => opt.value === targetSubVal)) {
                        this.dom.subMode.value = targetSubVal;
                    } else if (prevSubVal && Array.from(this.dom.subMode.options).some(opt => opt.value === prevSubVal)) {
                        this.dom.subMode.value = prevSubVal;
                    }
                }
            }

            randomizeSettings() {
                if (this.dom.mainMode.value === 'hue_tone') {
                    const hueVal = Math.floor(ColorMath.random(1, 12)) * 15;
                    const satVal = ColorMath.random(-0.05, 0.05);
                    const litVal = ColorMath.random(-0.1, 0.1);

                    this.dom.hueStepSlider.value = hueVal;
                    this.dom.satStepSlider.value = satVal;
                    this.dom.litStepSlider.value = litVal;
                    
                    // 値をInputフィールドにも反映させる
                    this.dom.hueStepInput.value = hueVal;
                    this.dom.satStepInput.value = satVal.toFixed(2);
                    this.dom.litStepInput.value = litVal.toFixed(2);
                } else {
                    const opts = Array.from(this.dom.subMode.options);
                    if (opts.length > 0) {
                        this.dom.subMode.value = opts[Math.floor(Math.random() * opts.length)].value;
                    }
                }
            }

            applyGlobalAdjustmentsAndRender(recordHistory = true) {
                if (this.currentColors.length === 0) return;
                
                const globalHue = parseFloat(this.dom.globalHueInput.value) || 0;
                const globalSat = (parseFloat(this.dom.globalSatInput.value) || 0) / 100;
                const globalLit = (parseFloat(this.dom.globalLitInput.value) || 0) / 100;

                this.currentColors.forEach(c => {
                    if (!c.originalOklch) {
                        c.originalOklch = { ...c.oklch };
                    }
                    const orig = c.originalOklch;
                    
                    let h = (orig.h + globalHue) % 360;
                    if (h < 0) h += 360;
                    let c_val = Math.max(0.0, Math.min(1.0, orig.c * (1.0 + globalSat)));
                    let l = Math.max(0.0, Math.min(1.0, orig.l + globalLit));

                    const oklch = { l, c: c_val, h };
                    const rgb = ColorMath.oklchToRgb(oklch.l, oklch.c, oklch.h);
                    
                    c.oklch = oklch;
                    c.rgb = rgb;
                    c.hex = ColorMath.rgbToHex(rgb[0], rgb[1], rgb[2]);
                });

                this.renderPanes();
                if (recordHistory) {
                    this.pushHistory(this.currentColors);
                }
            }

            generateNewPalette(keepBase = false, recordHistory = true) {
                const mainVal = this.dom.mainMode.value;
                const subVal = this.dom.subMode.value;
                const count = parseInt(this.dom.colorCountSlider.value);

                const settings = {
                    hueStep: parseFloat(this.dom.hueStepInput.value) || 0,
                    satStep: parseFloat(this.dom.satStepInput.value) || 0,
                    litStep: parseFloat(this.dom.litStepInput.value) || 0
                };

                let baseState = null;
                if (keepBase && this.currentColors.length > 0) {
                    const firstColor = this.currentColors[0];
                    const targetOklch = firstColor.originalOklch || firstColor.oklch || ColorMath.rgbToOklch(...firstColor.rgb);
                    baseState = { ...targetOklch };
                }

                // 新しく生成
                let newColors = PaletteGenerator.generate(mainVal, subVal, count, settings, baseState);

                const globalHue = parseFloat(this.dom.globalHueInput.value) || 0;
                const globalSat = (parseFloat(this.dom.globalSatInput.value) || 0) / 100;
                const globalLit = (parseFloat(this.dom.globalLitInput.value) || 0) / 100;

                if (globalHue !== 0 || globalSat !== 0 || globalLit !== 0) {
                    newColors.forEach(c => {
                        if (!c.originalOklch) c.originalOklch = { ...c.oklch };
                        const orig = c.originalOklch;
                        let h = (orig.h + globalHue) % 360;
                        if (h < 0) h += 360;
                        let c_val = Math.max(0.0, Math.min(1.0, orig.c * (1.0 + globalSat)));
                        let l = Math.max(0.0, Math.min(1.0, orig.l + globalLit));
                        const oklch = { l, c: c_val, h };
                        const rgb = ColorMath.oklchToRgb(oklch.l, oklch.c, oklch.h);
                        c.oklch = oklch;
                        c.rgb = rgb;
                        c.hex = ColorMath.rgbToHex(rgb[0], rgb[1], rgb[2]);
                    });
                }

                // 修正: 既存の色配列（this.currentColors）の中でロックされている位置の色は、色数や生成処理に関わらず絶対に上書きされず保持されるようにする
                newColors = newColors.map((c, i) => {
                    const old = this.currentColors[i];
                    if (old && old.locked) {
                        // 完全に古い状態（ロック状態、色、幅比率）をそのまま維持して返す
                        return {
                            ...old,
                            widthRatio: old.widthRatio !== undefined ? old.widthRatio : 1
                        };
                    }
                    if (old) {
                        return {
                            ...c,
                            widthRatio: old.widthRatio !== undefined ? old.widthRatio : 1,
                            locked: false
                        };
                    }
                    return {
                        ...c,
                        widthRatio: 1,
                        locked: false
                    };
                });

                // 修正: ドラッグ時と同様に、各ペインの比率が最小許容サイズ（最小50px相当）を下回らないように厳密にクランプする
                const containerWidth = this.dom.colorPanes.offsetWidth || 800; // 取得できない場合のフォールバック幅
                const minPx = 50;
                
                // 全体の widthRatio の合計を計算
                let totalRatio = newColors.reduce((sum, c) => sum + c.widthRatio, 0);
                // 50pxが全体の比率に対してどれくらいの比率値に相当するかを計算
                const minRatioLimit = (minPx / containerWidth) * totalRatio;

                // 各ペインが最小制限を下回っている場合は、最小サイズに引き上げる
                newColors.forEach(c => {
                    if (c.widthRatio < minRatioLimit) {
                        c.widthRatio = minRatioLimit;
                    }
                });

                this.currentColors = newColors;
                this.renderPanes();

                if (recordHistory) {
                    this.pushHistory(this.currentColors);
                }
            }

            /**
             * ペインの初期レンダリング（全色数変更時や新規生成時）
             */
            renderPanes() {
                this.dom.colorPanes.innerHTML = '';
                const count = this.currentColors.length;

                this.currentColors.forEach((colorObj, index) => {
                    const pane = document.createElement('div');
                    pane.className = 'color-pane h-full flex flex-col justify-end items-center pb-28 relative z-0';
                    
                    // 修正: widthRatio が数値であることを強制し、不正な場合は 1 にフォールバック
                    this.currentColors.forEach(c => {
                        if (c.widthRatio === undefined || isNaN(c.widthRatio) || c.widthRatio <= 0) {
                            c.widthRatio = 1;
                        }
                    });
                    const totalRatio = this.currentColors.reduce((sum, c) => sum + c.widthRatio, 0);
                    const widthPercent = (colorObj.widthRatio / totalRatio) * 100;
                    pane.style.width = `${widthPercent}%`;
                    pane.style.flexShrink = '0';
                    pane.style.flexGrow = '0';

                    pane.draggable = true; // ドラッグ並び替え用

                    const textColor = ColorMath.getAccessibleTextColor(colorObj.rgb[0], colorObj.rgb[1], colorObj.rgb[2]);
                    pane.style.color = textColor;

                    // --- ドラッグ＆ドロップによる並び替えイベント (PC用) ---
                    pane.addEventListener('dragstart', (e) => {
                        if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
                            e.preventDefault();
                            return;
                        }
                        if (e.target.tagName === 'INPUT' || e.target.closest('input')) {
                            e.preventDefault();
                            return;
                        }
                        e.dataTransfer.setData('text/plain', index);
                        pane.classList.add('opacity-40');
                    });
                    pane.addEventListener('dragend', () => {
                        pane.classList.remove('opacity-40');
                    });
                    pane.addEventListener('dragover', (e) => {
                        e.preventDefault();
                    });
                    pane.addEventListener('drop', (e) => {
                        e.preventDefault();
                        const fromIdx = parseInt(e.dataTransfer.getData('text/plain'));
                        const toIdx = index;
                        if (fromIdx !== toIdx) {
                            const moved = this.currentColors.splice(fromIdx, 1)[0];
                            this.currentColors.splice(toIdx, 0, moved);
                            this.renderPanes();
                            this.pushHistory(this.currentColors);
                        }
                    });

                    // --- スマホ用：タッチスワイプによる色領域の移動（並び替え）イベント ---
                    let paneTouchStartX = 0;
                    let paneTouchStartY = 0;
                    pane.addEventListener('touchstart', (e) => {
                        // リサイズ操作中であれば、ペイン移動の判定を絶対に発火させない
                        if (this.isResizing) {
                            return;
                        }
                        if (e.target.closest('.resize-handle') || e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON' || e.target.closest('button')) {
                            return;
                        }
                        const rect = pane.getBoundingClientRect();
                        if (e.touches[0].clientX > rect.right - 20) {
                            return;
                        }
                        if (rect.width < 70) {
                            const relativeX = e.touches[0].clientX - rect.left;
                            if (relativeX < 10 || relativeX > rect.width - 10) {
                                return;
                            }
                        }
                        paneTouchStartX = e.touches[0].clientX;
                        paneTouchStartY = e.touches[0].clientY;
                    }, { passive: true });

                    pane.addEventListener('touchend', (e) => {
                        if (e.target.closest('.resize-handle') || e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON' || e.target.closest('button')) {
                            return;
                        }
                        const endX = e.changedTouches[0].clientX;
                        const endY = e.changedTouches[0].clientY;
                        const deltaX = endX - paneTouchStartX;
                        const deltaY = endY - paneTouchStartY;

                        // 横方向へのスワイプが一定以上（50px超）の場合、指を離した位置のペインへ直接移動
                        if (Math.abs(deltaX) > 50 && Math.abs(deltaX) > Math.abs(deltaY)) {
                            const paneElements = Array.from(this.dom.colorPanes.children);
                            let targetIndex = index;

                            paneElements.forEach((pEl, pIdx) => {
                                const rect = pEl.getBoundingClientRect();
                                if (endX >= rect.left && endX <= rect.right) {
                                    targetIndex = pIdx;
                                }
                            });

                            if (targetIndex !== index) {
                                const moved = this.currentColors.splice(index, 1)[0];
                                this.currentColors.splice(targetIndex, 0, moved);
                                this.renderPanes();
                                this.pushHistory(this.currentColors);
                            }
                        }
                    }, { passive: true });

                    // --- ロックボタン（カラーコードの少し上） ---
                    const lockBtn = document.createElement('button');
                    // 文字を排し、アイコン表現のみにしてサイズを拡大
                    lockBtn.innerHTML = colorObj.locked ? '🔒' : '🔓';
                    lockBtn.className = 'w-11 h-11 flex items-center justify-center text-lg md:text-xl bg-black/40 hover:bg-black/60 rounded-full cursor-pointer transition-colors shadow-md mb-1.5';
                    lockBtn.title = colorObj.locked ? 'ロック中 (クリックで解除)' : 'クリックで色をロック';
                    lockBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        
                        // 修正: 入力値の同期を先に行う
                        const inputEl = pane.querySelector('input[type="text"]');
                        if (inputEl) {
                            this.handleColorEditInput(index, inputEl.value, pane);
                        }

                        // 修正: オブジェクト更新後に、確実に対象の locked 状態を反転させる
                        if (this.currentColors[index]) {
                            this.currentColors[index].locked = !this.currentColors[index].locked;
                            if (this.currentColors[index].widthRatio === undefined || isNaN(this.currentColors[index].widthRatio)) {
                                this.currentColors[index].widthRatio = 1;
                            }
                        }
                        this.renderPanes();
                    });
                    pane.appendChild(lockBtn);

                    // --- カラーコード入力欄 ---
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.value = colorObj.hex;
                    input.maxLength = 7;
                    input.ariaLabel = 'カラーコードを編集';
                    input.className = `bg-transparent border-none outline-none text-center color-text font-bold tracking-wider focus:opacity-100 drop-shadow-md pb-0 md:pb-0 w-full uppercase truncate px-0.5 md:px-1`;

                    // ペインの幅に連動してフォントサイズを動的計算（初期化）
                    const updateFontSize = () => {
                        const paneWidth = pane.clientWidth || 100;
                        const calculatedSize = Math.max(10, Math.min(32, paneWidth * 0.15));
                        input.style.fontSize = `${calculatedSize}px`;
                    };
                    
                    // 修正: input上でマウスをドラッグして文字選択できるように、親ペインへのドラッグ伝播やdraggable属性を制御
                    input.addEventListener('mousedown', (e) => {
                        e.stopPropagation();
                        pane.draggable = false; // 文字選択中はペインのドラッグを無効化
                    });
                    input.addEventListener('touchstart', (e) => {
                        e.stopPropagation();
                        pane.draggable = false; // タッチ端末でもドラッグを無効化
                    }, { passive: true });
                    input.addEventListener('blur', () => {
                        pane.draggable = true; // フォーカスが外れたらペインのドラッグを復元
                    });
                    input.addEventListener('selectstart', (e) => {
                        e.stopPropagation();
                    });

                    input.addEventListener('input', (e) => this.handleColorEditInput(index, e.target.value, pane));
                    input.addEventListener('change', () => {
                        pane.draggable = true;
                        this.pushHistory(this.currentColors);
                    });

                    // --- コピーボタン ---
                    const copyBtn = document.createElement('button');
                    copyBtn.textContent = 'Copy';
                    copyBtn.className = 'text-xs uppercase tracking-widest opacity-60 font-semibold mb-2 md:mb-4 hover:opacity-100 transition-opacity cursor-pointer';
                    copyBtn.addEventListener('click', () => this.copyToClipboard(this.currentColors[index].hex));

                    pane.appendChild(input);
                    pane.appendChild(copyBtn);

                    // --- 境界線リサイズハンドル（最後尾以外に設置） ---
                    if (index < count - 1) {
                        const handle = document.createElement('div');
                        handle.className = 'resize-handle';
                        
                        const setupResize = (getClientX, addEvents, removeEvents) => {
                            return (e) => {
                                e.preventDefault();
                                this.isResizing = true; // リサイズ中フラグを立てる
                                handle.style.background = 'rgba(255, 255, 255, 0.2)';
                                let lastX = getClientX(e);
                                const leftPaneObj = this.currentColors[index];
                                const rightPaneObj = this.currentColors[index + 1];

                                const onMove = (moveEvent) => {
                                    const currentX = getClientX(moveEvent);
                                    const deltaX = currentX - lastX;
                                    lastX = currentX;

                                    if (deltaX === 0) return;
                                    const currentPairTotalWidth = pane.offsetWidth + (pane.nextElementSibling ? pane.nextElementSibling.offsetWidth : 0);
                                    if (currentPairTotalWidth === 0) return;

                                    const totalRatio = this.currentColors.reduce((sum, c) => sum + c.widthRatio, 0);
                                    const pairSum = leftPaneObj.widthRatio + rightPaneObj.widthRatio;
                                    const deltaRatio = (deltaX / currentPairTotalWidth) * pairSum;
                                    
                                    let newLeft = leftPaneObj.widthRatio + deltaRatio;
                                    let newRight = rightPaneObj.widthRatio - deltaRatio;
                                
                                    const containerWidth = this.dom.colorPanes.offsetWidth;
                                    const minPx = 50; 
                                    const minSize = (minPx / containerWidth) * totalRatio;
                                
                                    if (newLeft < minSize) {
                                        const diff = minSize - newLeft;
                                        newLeft = minSize;
                                        newRight -= diff;
                                    } else if (newRight < minSize) {
                                        const diff = minSize - newRight;
                                        newRight = minSize;
                                        newLeft -= diff;
                                    }
                                
                                    leftPaneObj.widthRatio = newLeft;
                                    rightPaneObj.widthRatio = newRight;
                                
                                    pane.style.width = `${(newLeft / totalRatio) * 100}%`;
                                    const nextPaneEl = pane.nextElementSibling;
                                    if (nextPaneEl) {
                                        nextPaneEl.style.width = `${(newRight / totalRatio) * 100}%`;
                                    }
                                    
                                    const updatePaneFont = (p) => {
                                        const inp = p.querySelector('input[type="text"]');
                                        if (inp) {
                                            const pWidth = p.clientWidth || 100;
                                            inp.style.fontSize = `${Math.max(10, Math.min(32, pWidth * 0.15))}px`;
                                        }
                                    };
                                    updatePaneFont(pane);
                                    if (nextPaneEl) updatePaneFont(nextPaneEl);

                                    this.updateBackground();
                                };

                                const onEnd = () => {
                                    this.isResizing = false; // リサイズ終了
                                    handle.style.background = '';
                                    removeEvents(onMove, onEnd);
                                    this.pushHistory(this.currentColors);
                                };

                                addEvents(onMove, onEnd);
                            };
                        };

                        // マウス操作用
                        handle.addEventListener('mousedown', setupResize(
                            (e) => e.clientX,
                            (move, end) => {
                                window.addEventListener('mousemove', move);
                                window.addEventListener('mouseup', end);
                            },
                            (move, end) => {
                                window.removeEventListener('mousemove', move);
                                window.removeEventListener('mouseup', end);
                            }
                        ));

                        // スマホタッチ操作用
                        handle.addEventListener('touchstart', (e) => {
                            e.stopPropagation(); // 境界線操作が色領域の移動（並び替え）と競合するのを防ぐ
                            setupResize(
                                (ev) => ev.touches[0].clientX,
                                (move, end) => {
                                    window.addEventListener('touchmove', move, { passive: false });
                                    window.addEventListener('touchend', end);
                                },
                                (move, end) => {
                                    window.removeEventListener('touchmove', move);
                                    window.removeEventListener('touchend', end);
                                }
                            )(e);
                        }, { passive: false });

                        pane.appendChild(handle);
                    }

                    this.dom.colorPanes.appendChild(pane);
                    updateFontSize();
                });

                this.updateBackground();
            }

            /**
             * HEX手入力時のインプレース更新（DOM再構築を回避してフォーカス維持）
             */
            handleColorEditInput(index, hexValue, paneEl) {
                // 修正: 全角で入力された英数字や#を自動的に半角に変換し、入力欄の表示も同期させる
                hexValue = this.toHalfWidth(hexValue);
                const inputEl = paneEl.querySelector('input[type="text"]');
                if (inputEl && inputEl.value !== hexValue) {
                    const start = inputEl.selectionStart;
                    inputEl.value = hexValue;
                    inputEl.setSelectionRange(start, start);
                }

                if (hexValue && !hexValue.startsWith('#')) hexValue = '#' + hexValue;
                const isValidHex = /^#[0-9A-F]{6}$/i.test(hexValue);
                
                const oldObj = this.currentColors[index] || {};
                if (!oldObj.widthRatio) oldObj.widthRatio = 1;
                
                if (isValidHex) {
                    let h = hexValue.replace(/^#/, '');
                    if (h.length === 3) h = h.split('').map(c => c + c).join('');
                    const num = parseInt(h, 16);
                    const rgb = [num >> 16, (num >> 8) & 255, num & 255];
                    
                    const oklch = ColorMath.rgbToOklch(rgb[0], rgb[1], rgb[2]);
                    
                    // 修正: 既存の locked や widthRatio などのプロパティを確実に明示的に引き継ぐ
                    this.currentColors[index] = { 
                        ...oldObj,
                        rgb, 
                        hex: hexValue.toUpperCase(), 
                        oklch,
                        originalOklch: { ...oklch },
                        widthRatio: oldObj.widthRatio !== undefined ? oldObj.widthRatio : 1,
                        locked: oldObj.locked !== undefined ? oldObj.locked : false
                    };
                    
                    const textColor = ColorMath.getAccessibleTextColor(rgb[0], rgb[1], rgb[2]);
                    paneEl.style.color = textColor;
                    this.updateBackground();
                } else {
                    // 入力途中であっても hex 文字列と既存のロック状態を保持する
                    this.currentColors[index] = {
                        ...oldObj,
                        hex: hexValue
                    };
                }
            }

            updateBackground() {
                const panes = Array.from(this.dom.colorPanes.children);
                const hexes = this.currentColors.map(c => c.hex);

                // 実際のDOM要素のピクセル幅（clientWidth）が取得できる場合は、それをもとに正確に背景を計算する
                if (panes.length === hexes.length && this.dom.colorPanes.clientWidth > 0) {
                    const totalWidth = this.dom.colorPanes.clientWidth;
                    let currentPercent = 0;
                    const stops = [];

                    panes.forEach((pane, i) => {
                        const paneWidth = pane.clientWidth;
                        const startPct = currentPercent;
                        const endPct = currentPercent + (paneWidth / totalWidth) * 100;

                        if (this.isSplitMode) {
                            // きっぱり分けるモード：各領域の実際の描画幅に合わせる
                            stops.push(`${hexes[i]} ${startPct}%, ${hexes[i]} ${endPct}%`);
                        } else {
                            // グラデーションモード：各領域の実際の中央位置で滑らかに繋ぐ
                            const midPct = startPct + ((endPct - startPct) / 2);
                            if (i === 0) {
                                stops.push(`${hexes[i]} ${startPct}%`);
                                stops.push(`${hexes[i]} ${midPct}%`);
                            } else if (i === panes.length - 1) {
                                stops.push(`${hexes[i]} ${midPct}%`);
                                stops.push(`${hexes[i]} 100%`);
                            } else {
                                stops.push(`${hexes[i]} ${midPct}%`);
                            }
                        }
                        currentPercent = endPct;
                    });

                    this.dom.mainContainer.style.background = `linear-gradient(to right, ${stops.join(', ')})`;
                } else {
                    // フォールバック（DOMがまだ描画されていない初期状態など）
                    const ratios = this.currentColors.map(c => c.widthRatio);
                    const totalRatio = ratios.reduce((sum, r) => sum + r, 0);
                    let currentPercent = 0;
                    const stops = [];

                    ratios.forEach((ratio, i) => {
                        const percent = (ratio / totalRatio) * 100;
                        const startPct = currentPercent;
                        let endPct = currentPercent + percent;
                        if (i === ratios.length - 1) endPct = 100; // 最後の要素の終端を厳密に100%に固定
                        const midPct = startPct + ((endPct - startPct) / 2);

                        if (this.isSplitMode) {
                            if (i === ratios.length - 1) {
                                stops.push(`${hexes[i]} ${startPct}%, ${hexes[i]} 100%`);
                            } else {
                                stops.push(`${hexes[i]} ${startPct}%, ${hexes[i]} ${endPct}%`);
                            }
                        } else {
                            if (i === 0) {
                                stops.push(`${hexes[i]} ${startPct}%`);
                                stops.push(`${hexes[i]} ${midPct}%`);
                            } else if (i === hexes.length - 1) {
                                stops.push(`${hexes[i]} ${midPct}%`);
                                stops.push(`${hexes[i]} 100%`);
                            } else {
                                stops.push(`${hexes[i]} ${midPct}%`);
                            }
                        }
                        currentPercent = endPct;
                    });

                    this.dom.mainContainer.style.background = `linear-gradient(to right, ${stops.join(', ')})`;
                }

                // サイドバー内の縦長プレビュー（上から下へ、各色領域のサイズ変化・比率および分割モードを完全に反映）
                const sidebarPreview = document.getElementById('sidebar-gradient-preview');
                if (sidebarPreview && hexes.length > 0) {
                    const ratios = this.currentColors.map(c => c.widthRatio !== undefined ? c.widthRatio : 1);
                    const totalRatio = ratios.reduce((sum, r) => sum + r, 0) || 1;
                    let currentPercent = 0;
                    const stops = [];

                    ratios.forEach((ratio, i) => {
                        const percent = (ratio / totalRatio) * 100;
                        const startPct = currentPercent;
                        let endPct = currentPercent + percent;
                        if (i === ratios.length - 1) endPct = 100; // 最後の要素の終端を100.5%に拡張して隙間や色漏れを完全に防止
                        const midPct = startPct + ((endPct - startPct) / 2);

                        if (this.isSplitMode) {
                            if (i === ratios.length - 1) {
                                stops.push(`${hexes[i]} ${startPct}%, ${hexes[i]} ${endPct}%`);
                            } else {
                                stops.push(`${hexes[i]} ${startPct}%, ${hexes[i]} ${endPct}%`);
                            }
                        } else {
                            if (i === 0) {
                                stops.push(`${hexes[i]} ${startPct}%`);
                                stops.push(`${hexes[i]} ${midPct}%`);
                            } else if (i === hexes.length - 1) {
                                stops.push(`${hexes[i]} ${midPct}%`);
                                stops.push(`${hexes[i]} ${endPct}%`);
                            } else {
                                stops.push(`${hexes[i]} ${midPct}%`);
                            }
                        }
                        currentPercent = endPct;
                    });

                    sidebarPreview.style.backgroundImage = `linear-gradient(to bottom, ${stops.join(', ')})`;
                }
            }


            saveState() {
                const state = {
                    currentColors: this.currentColors,
                    mainMode: this.dom.mainMode.value,
                    subMode: this.dom.subMode.value,
                    colorCount: this.dom.colorCountSlider.value,
                    isSplitMode: this.isSplitMode,
                    globalHue: this.dom.globalHueInput.value,
                    globalSat: this.dom.globalSatInput.value,
                    globalLit: this.dom.globalLitInput.value,
                    hueStep: this.dom.hueStepInput.value,
                    satStep: this.dom.satStepInput.value,
                    litStep: this.dom.litStepInput.value,
                    currentLang: this.currentLang
                };
                localStorage.setItem(CONFIG.STATE_STORAGE_KEY, JSON.stringify(state));
            }

            loadState() {
                try {
                    const saved = localStorage.getItem(CONFIG.STATE_STORAGE_KEY);
                    if (!saved) return false;
                    const state = JSON.parse(saved);
                    
                    if (state.currentLang) {
                        this.currentLang = state.currentLang;
                        this.dom.langToggleBtn.textContent = this.currentLang === 'ja' ? '🇯🇵' : '🇺🇸';
                        this.dom.langToggleBtn.title = this.currentLang === 'ja' ? '言語切替 / Language' : 'Language Switch / 日本語';
                    }
                    if (state.colorCount) {
                        this.dom.colorCountSlider.value = state.colorCount;
                        this.dom.colorCountValue.textContent = this.getColorCountText(state.colorCount);
                    }
                    if (state.mainMode) {
                        this.dom.mainMode.value = state.mainMode;
                    }
                    this.updateSubModes();
                    if (state.subMode) {
                        this.dom.subMode.value = state.subMode;
                    }
                    if (state.isSplitMode !== undefined) {
                        this.setDisplayMode(state.isSplitMode, false);
                    }
                    if (state.globalHue !== undefined) {
                        this.dom.globalHueSlider.value = state.globalHue;
                        this.dom.globalHueInput.value = state.globalHue;
                    }
                    if (state.globalSat !== undefined) {
                        this.dom.globalSatSlider.value = state.globalSat;
                        this.dom.globalSatInput.value = state.globalSat;
                    }
                    if (state.globalLit !== undefined) {
                        this.dom.globalLitSlider.value = state.globalLit;
                        this.dom.globalLitInput.value = state.globalLit;
                    }
                    if (state.hueStep !== undefined) {
                        this.dom.hueStepSlider.value = state.hueStep;
                        this.dom.hueStepInput.value = state.hueStep;
                    }
                    if (state.satStep !== undefined) {
                        this.dom.satStepSlider.value = state.satStep;
                        this.dom.satStepInput.value = state.satStep;
                    }
                    if (state.litStep !== undefined) {
                        this.dom.litStepSlider.value = state.litStep;
                        this.dom.litStepInput.value = state.litStep;
                    }

                    if (state.currentColors && state.currentColors.length > 0) {
                        this.currentColors = state.currentColors;
                        this.renderPanes();
                        this.pushHistory(this.currentColors);
                        this.updateTexts();
                        return true;
                    }
                } catch (e) {
                    console.error('Failed to load state', e);
                }
                return false;
            }

            resetHueToneSettings() {
                if (this.dom.hueStepSlider) this.dom.hueStepSlider.value = 60;
                if (this.dom.hueStepInput) this.dom.hueStepInput.value = 60;
                if (this.dom.satStepSlider) this.dom.satStepSlider.value = 0;
                if (this.dom.satStepInput) this.dom.satStepInput.value = '0.00';
                if (this.dom.litStepSlider) this.dom.litStepSlider.value = 0;
                if (this.dom.litStepInput) this.dom.litStepInput.value = '0.00';

                this.generateNewPalette(true);
                this.saveState();
            }

            resetGlobalSettings() {
                if (this.dom.globalHueSlider) this.dom.globalHueSlider.value = 0;
                if (this.dom.globalHueInput) this.dom.globalHueInput.value = 0;
                if (this.dom.globalSatSlider) this.dom.globalSatSlider.value = 0;
                if (this.dom.globalSatInput) this.dom.globalSatInput.value = 0;
                if (this.dom.globalLitSlider) this.dom.globalLitSlider.value = 0;
                if (this.dom.globalLitInput) this.dom.globalLitInput.value = 0;

                this.applyGlobalAdjustmentsAndRender(true);
                this.saveState();
            }

            pushHistory(colors = null) {
                const currentState = {
                    colors: JSON.parse(JSON.stringify(this.currentColors)),
                    mainMode: this.dom.mainMode.value,
                    subMode: this.dom.subMode.value,
                    colorCount: this.dom.colorCountSlider.value,
                    isSplitMode: this.isSplitMode,
                    globalHue: this.dom.globalHueInput.value,
                    globalSat: this.dom.globalSatInput.value,
                    globalLit: this.dom.globalLitInput.value,
                    hueStep: this.dom.hueStepInput.value,
                    satStep: this.dom.satStepInput.value,
                    litStep: this.dom.litStepInput.value
                };
                if (this.historyIndex >= 0 && this.history[this.historyIndex]) {
                    if (JSON.stringify(this.history[this.historyIndex]) === JSON.stringify(currentState)) return;
                }
                this.history = this.history.slice(0, this.historyIndex + 1);
                this.history.push(currentState);
                this.historyIndex = this.history.length - 1;
                this.updateHistoryButtons();
                this.saveState();
            }

            applyStateSnapshot(state) {
                this.currentColors = JSON.parse(JSON.stringify(state.colors));
                if (state.mainMode) this.dom.mainMode.value = state.mainMode;
                if (state.colorCount) {
                    this.dom.colorCountSlider.value = state.colorCount;
                    this.dom.colorCountValue.textContent = this.getColorCountText(state.colorCount);
                }
                this.updateSubModes();
                if (state.subMode) this.dom.subMode.value = state.subMode;
                if (state.isSplitMode !== undefined) this.setDisplayMode(state.isSplitMode, false);
                if (state.globalHue !== undefined) {
                    this.dom.globalHueSlider.value = state.globalHue;
                    this.dom.globalHueInput.value = state.globalHue;
                }
                if (state.globalSat !== undefined) {
                    this.dom.globalSatSlider.value = state.globalSat;
                    this.dom.globalSatInput.value = state.globalSat;
                }
                if (state.globalLit !== undefined) {
                    this.dom.globalLitSlider.value = state.globalLit;
                    this.dom.globalLitInput.value = state.globalLit;
                }
                if (state.hueStep !== undefined) {
                    this.dom.hueStepSlider.value = state.hueStep;
                    this.dom.hueStepInput.value = state.hueStep;
                }
                if (state.satStep !== undefined) {
                    this.dom.satStepSlider.value = state.satStep;
                    this.dom.satStepInput.value = state.satStep;
                }
                if (state.litStep !== undefined) {
                    this.dom.litStepSlider.value = state.litStep;
                    this.dom.litStepInput.value = state.litStep;
                }
                this.renderPanes();
            }

            undo() {
                if (this.historyIndex > 0) {
                    this.historyIndex--;
                    const state = this.history[this.historyIndex];
                    this.applyStateSnapshot(state);
                    this.updateHistoryButtons();
                    this.saveState();
                }
            }

            redo() {
                if (this.historyIndex < this.history.length - 1) {
                    this.historyIndex++;
                    const state = this.history[this.historyIndex];
                    this.applyStateSnapshot(state);
                    this.updateHistoryButtons();
                    this.saveState();
                }
            }

            updateHistoryButtons() {
                this.dom.undoBtn.disabled = this.historyIndex <= 0;
                this.dom.redoBtn.disabled = this.historyIndex >= this.history.length - 1;
            }

            saveStock() {
                if (this.stocks.length >= CONFIG.MAX_STOCKS) {
                    alert(`ストックの最大保存数(${CONFIG.MAX_STOCKS}個)に達しています。不要なストックを削除してください。`);
                    return;
                }
                const newStock = {
                    id: Date.now(),
                    name: `Stock ${this.stocks.length + 1}`,
                    mainMode: this.dom.mainMode.value,
                    subMode: this.dom.subMode.value,
                    colorCount: this.dom.colorCountSlider.value,
                    isSplitMode: this.isSplitMode,
                    globalHue: this.dom.globalHueInput.value,
                    globalSat: this.dom.globalSatInput.value,
                    globalLit: this.dom.globalLitInput.value,
                    hueStep: this.dom.hueStepInput.value,
                    satStep: this.dom.satStepInput.value,
                    litStep: this.dom.litStepInput.value,
                    colors: JSON.parse(JSON.stringify(this.currentColors))
                };
                this.stocks.push(newStock);
                localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(this.stocks));
                this.renderStocks();
            }

            updateTexts() {
                const t = this.translations[this.currentLang];
                document.getElementById('txt-edit-screen').textContent = t.editScreen;
                document.getElementById('txt-color-count-label').textContent = t.colorCount;
                document.getElementById('txt-global-adjustment').textContent = t.globalAdjustment;
                document.getElementById('txt-global-hue-label').textContent = t.globalHueLabel;
                document.getElementById('txt-global-sat-label').textContent = t.globalSatLabel;
                document.getElementById('txt-global-lit-label').textContent = t.globalLitLabel;
                document.getElementById('color-count-value').textContent = this.getColorCountText(this.dom.colorCountSlider.value);
                document.getElementById('txt-palette-category').textContent = t.paletteCategory;
                document.getElementById('txt-display-mode').textContent = t.displayMode;
                document.getElementById('txt-stock-list').textContent = t.stockList;
                document.getElementById('copy-current-css-btn').textContent = t.copyCss;
                document.getElementById('copy-tailwind-btn').textContent = t.copyTailwind;
                document.getElementById('export-current-json-btn').textContent = t.exportJson;
                document.getElementById('export-csv-btn').textContent = t.exportCsv;
                document.getElementById('txt-reset-widths').textContent = t.resetWidths;
                document.getElementById('txt-save').textContent = t.save;
                document.getElementById('txt-generate').textContent = t.generate;
                document.getElementById('txt-random').textContent = t.random;
                document.getElementById('txt-update').textContent = t.update;
                document.getElementById('txt-hue-step-label').textContent = t.hueStepLabel;
                document.getElementById('txt-sat-step-label').textContent = t.satStepLabel;
                document.getElementById('txt-lit-step-label').textContent = t.litStepLabel;
                document.getElementById('txt-sc-title').textContent = t.shortcuts.title;
                document.getElementById('txt-sc-key-space').textContent = t.shortcuts.spaceKey;
                document.getElementById('txt-sc-val-space').textContent = t.shortcuts.spaceVal;
                document.getElementById('txt-sc-key-r').textContent = t.shortcuts.rKey;
                document.getElementById('txt-sc-val-r').textContent = t.shortcuts.rVal;
                document.getElementById('txt-sc-val-z').textContent = t.shortcuts.zVal;
                document.getElementById('txt-sc-val-y').textContent = t.shortcuts.yVal;
                document.getElementById('txt-sc-key-s').textContent = t.shortcuts.sKey;
                document.getElementById('txt-sc-val-s').textContent = t.shortcuts.sVal;
                document.getElementById('txt-sc-key-swipe').textContent = t.shortcuts.swipeKey;
                document.getElementById('txt-sc-val-swipe').textContent = t.shortcuts.swipeVal;
                document.getElementById('txt-sc-close').textContent = t.shortcuts.close;
                document.getElementById('mode-gradient').textContent = t.gradient;
                document.getElementById('mode-split').textContent = t.split;

                const mainModeOpts = document.getElementById('main-mode').options;
                for (let i = 0; i < mainModeOpts.length; i++) {
                    if (t.mainModes[i]) mainModeOpts[i].textContent = t.mainModes[i];
                }

                this.updateSubModes();
            }

            renderStocks() {
                this.dom.stockList.innerHTML = '';
                this.stocks.forEach((stock, index) => {
                    const item = document.createElement('div');
                    item.className = 'bg-black/40 border border-white/10 rounded-xl p-3 space-y-2';

                    const hexes = stock.colors.map(c => c.hex);
                    const ratios = stock.colors.map(c => c.widthRatio !== undefined ? c.widthRatio : 1);
                    const totalRatio = ratios.reduce((sum, r) => sum + r, 0) || 1;
                    let currentPercent = 0;
                    const stops = [];
                    const isSplit = stock.isSplitMode ? true : false;

                    item.innerHTML = `
                        <div class="flex justify-between items-center gap-2">
                            <input type="text" value="${stock.name}" class="stock-name bg-transparent text-xs font-semibold text-white border-b border-transparent hover:border-white/30 focus:border-indigo-400 outline-none w-full py-0.5">
                            <div class="flex items-center gap-1">
                                <button class="overwrite-btn p-1 text-white/60 hover:text-blue-400 transition-colors cursor-pointer" title="現在の配色で上書き保存">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" />
                                    </svg>
                                </button>
                                <button class="delete-btn p-1 text-white/60 hover:text-red-400 transition-colors cursor-pointer" title="削除">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <div class="stock-preview-container overflow-hidden rounded-lg border border-white/10 cursor-pointer" title="クリックで適用">
                            <div class="preview-bar flex h-5 -mx-2 w-[calc(100%+16px)]"></div>
                        </div>
                    `;

                    const previewBar = item.querySelector('.preview-bar');
                    if (isSplit) {
                        ratios.forEach((ratio, i) => {
                            const widthPercent = (ratio / totalRatio) * 100;
                            const colorDiv = document.createElement('div');
                            colorDiv.className = 'h-full';
                            colorDiv.style.width = `${widthPercent}%`;
                            colorDiv.style.backgroundColor = hexes[i];
                            previewBar.appendChild(colorDiv);
                        });
                    } else {
                        let currentPercent = 0;
                        const stops = [];
                        ratios.forEach((ratio, i) => {
                            const widthPercent = (ratio / totalRatio) * 100;
                            const startPct = currentPercent;
                            const endPct = currentPercent + widthPercent;
                            const midPct = startPct + ((endPct - startPct) / 2);

                            if (i === 0) {
                                stops.push(`${hexes[i]} ${startPct}%`);
                                stops.push(`${hexes[i]} ${midPct}%`);
                            } else if (i === hexes.length - 1) {
                                stops.push(`${hexes[i]} ${midPct}%`);
                                stops.push(`${hexes[i]} 100%`);
                            } else {
                                stops.push(`${hexes[i]} ${midPct}%`);
                            }
                            currentPercent = endPct;
                        });
                        previewBar.style.background = `linear-gradient(to right, ${stops.join(', ')})`;
                    }

                    item.querySelector('.stock-preview-container').addEventListener('click', () => {
                        if (stock.mainMode) {
                            this.dom.mainMode.value = stock.mainMode;
                        }
                        if (stock.colorCount) {
                            this.dom.colorCountSlider.value = stock.colorCount;
                            this.dom.colorCountValue.textContent = this.getColorCountText(stock.colorCount);
                        }
                        this.updateSubModes();
                        if (stock.subMode) {
                            this.dom.subMode.value = stock.subMode;
                        }
                        if (stock.isSplitMode !== undefined) {
                            this.setDisplayMode(stock.isSplitMode);
                        }
                        if (stock.globalHue !== undefined) {
                            this.dom.globalHueSlider.value = stock.globalHue;
                            this.dom.globalHueInput.value = stock.globalHue;
                        }
                        if (stock.globalSat !== undefined) {
                            this.dom.globalSatSlider.value = stock.globalSat;
                            this.dom.globalSatInput.value = stock.globalSat;
                        }
                        if (stock.globalLit !== undefined) {
                            this.dom.globalLitSlider.value = stock.globalLit;
                            this.dom.globalLitInput.value = stock.globalLit;
                        }
                        if (stock.hueStep !== undefined) {
                            this.dom.hueStepSlider.value = stock.hueStep;
                            this.dom.hueStepInput.value = stock.hueStep;
                        }
                        if (stock.satStep !== undefined) {
                            this.dom.satStepSlider.value = stock.satStep;
                            this.dom.satStepInput.value = stock.satStep;
                        }
                        if (stock.litStep !== undefined) {
                            this.dom.litStepSlider.value = stock.litStep;
                            this.dom.litStepInput.value = stock.litStep;
                        }

                        this.currentColors = JSON.parse(JSON.stringify(stock.colors));
                        this.renderPanes();
                        this.pushHistory(this.currentColors);
                    });

                    item.querySelector('.stock-name').addEventListener('change', (e) => {
                        this.stocks[index].name = e.target.value;
                        localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(this.stocks));
                    });

                    item.querySelector('.overwrite-btn').addEventListener('click', (e) => {
                        e.stopPropagation();
                        this.stocks[index] = {
                            ...this.stocks[index],
                            mainMode: this.dom.mainMode.value,
                            subMode: this.dom.subMode.value,
                            colorCount: this.dom.colorCountSlider.value,
                            isSplitMode: this.isSplitMode,
                            globalHue: this.dom.globalHueInput.value,
                            globalSat: this.dom.globalSatInput.value,
                            globalLit: this.dom.globalLitInput.value,
                            hueStep: this.dom.hueStepInput.value,
                            satStep: this.dom.satStepInput.value,
                            litStep: this.dom.litStepInput.value,
                            colors: JSON.parse(JSON.stringify(this.currentColors))
                        };
                        localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(this.stocks));
                        this.renderStocks();
                    });

                    item.querySelector('.delete-btn').addEventListener('click', (e) => {
                        e.stopPropagation();
                        this.stocks.splice(index, 1);
                        localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(this.stocks));
                        this.renderStocks();
                    });

                    this.dom.stockList.appendChild(item);
                });
            }

            // CSS Variables コピー
            copyCss() {
                const vars = this.currentColors.map((c, i) => `  --color-${i + 1}: ${c.hex};`).join('\n');
                const cssText = `:root {\n${vars}\n}`;
                this.copyToClipboard(cssText, 'css');
            }

            // Tailwind Config コピー
            copyTailwind() {
                const colorObj = {};
                this.currentColors.forEach((c, i) => {
                    colorObj[`color-${i + 1}`] = c.hex;
                });
                const tailwindText = `// tailwind.config.js\nmodule.exports = {\n  theme: {\n    extend: {\n      colors: {\n        palette: ${JSON.stringify(colorObj, null, 10).replace(/\n\s*/g, ' ')}\n      }\n    }\n  }\n};`;
                this.copyToClipboard(tailwindText, 'tailwind');
            }

            // JSON エクスポート
            exportJson() {
                const data = {
                    generator: "Color Palette Generator Pro",
                    date: new Date().toISOString(),
                    colors: this.currentColors
                };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                this.downloadBlob(blob, `palette_${Date.now()}.json`);
            }

            // CSV エクスポート
            exportCsv() {
                let csvContent = "Index,HEX,RGB,OKLCH_L,OKLCH_C,OKLCH_H\n";
                this.currentColors.forEach((c, i) => {
                    const oklch = c.oklch || { l: 0, c: 0, h: 0 };
                    csvContent += `${i + 1},"${c.hex}","rgb(${c.rgb.join(',')})",${oklch.l.toFixed(3)},${oklch.c.toFixed(3)},${oklch.h.toFixed(1)}\n`;
                });
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                this.downloadBlob(blob, `palette_${Date.now()}.csv`);
            }

            downloadBlob(blob, filename) {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.click();
                URL.revokeObjectURL(url);
            }

            async copyToClipboard(text, messageType = 'hex') {
                try {
                    await navigator.clipboard.writeText(text);
                    const t = this.translations[this.currentLang];
                    let message = t.copiedHex;
                    if (messageType === 'css') message = t.copiedCss;
                    if (messageType === 'tailwind') message = t.copiedTailwind;

                    this.dom.toastMsg.textContent = message;
                    this.dom.toast.classList.remove('toast-animate');
                    void this.dom.toast.offsetWidth;
                    this.dom.toast.classList.add('toast-animate');
                } catch (err) {
                    console.error('Copy failed', err);
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            window.app = new App();
        });
    </script>
</body>
</html>
