<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Scheme Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            overflow: hidden;
            display: flex;
            width: 100vw;
            height: 100vh;
        }
        
        #main-container {
            transition: background 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .color-text {
            transition: color 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        #settings-panel {
            background: rgba(24, 24, 27, 0.96);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            overflow: visible !important;
            margin-left: 0 !important;
            flex-shrink: 0;
            position: relative;
        }
        /* 縦長グラデーションプレビュー用スタイル（編集画面の左端の外側に隙間なくぴったり沿わせて配置・角丸なし） */
        #sidebar-gradient-preview {
            display: block;
            transition: background 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            position: absolute;
            left: -28px;
            top: 0;
            width: 28px;
            height: 100%;
            border-radius: 0;
            z-index: 60;
            box-shadow: -4px 0 15px rgba(0, 0, 0, 0.5);
            border-left: 1px solid rgba(255, 255, 255, 0.25);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            background-repeat: no-repeat;
            background-size: 100% calc(100% + 2px); /* 追加: 下端のサブピクセル隙間・色漏れを完全に隠す */
            pointer-events: none;
        }
        @media (min-width: 1201px) {
            #settings-panel {
                position: relative !important;
                transform: none !important;
                margin-left: 28px !important;
                display: flex !important;
            }
            #main-container {
                margin-left: 0 !important;
                width: auto !important;
                flex: 1 1 0% !important;
                min-width: 0 !important;
            }
            #open-drawer-btn {
                display: none !important;
            }
            #drawer-overlay {
                display: none !important;
            }
        }
        /* サイドバーが閉じられている（画面外にある）ときはプレビューも非表示にし、マージンも消す */
        #settings-panel.-translate-x-full {
            margin-left: 0 !important;
        }
        #settings-panel.-translate-x-full #sidebar-gradient-preview {
            display: none !important;
        }
        @media (max-width: 1200px) {
            #settings-panel {
                position: fixed !important;
                left: 0;
                top: 0;
                height: 100%;
                z-index: 50;
                margin-left: 28px !important; /* スマホ等の狭い画面で開いているときはプレビュー分右にシフト */
                box-sizing: border-box;
            }
            /* 閉じているときはマージンを0にする */
            #settings-panel.-translate-x-full {
                margin-left: 0 !important;
            }
            /* 画面が狭いときはハンバーガーボタンを表示する */
            #open-drawer-btn {
                display: flex !important;
            }
            /* ハンバーガーボタンが表示されているときは「幅をリセット」ボタンを右にずらす */
            #reset-widths-container {
                left: 5rem !important; /* ハンバーガーボタンと重ならないように位置を調整 */
            }
            /* パネルが開いている（-translate-x-fullがない）とき、メイン画面側にもたせる左マージン（色がパネルの裏に隠れるのを防止） */
            #main-container {
                margin-left: 0 !important;
            }
        }

        @keyframes slideUpFade {
            0% { opacity: 0; transform: translate(-50%, -20px); }
            10% { opacity: 1; transform: translate(-50%, 0); }
            90% { opacity: 1; transform: translate(-50%, 0); }
            100% { opacity: 0; transform: translate(-50%, -20px); }
        }
        .toast-animate {
            animation: slideUpFade 2.5s forwards;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        input[type=range] {
            accent-color: #E5F6FF;
        }

        /* ペイン操作用スタイル */
        .color-pane {
            transition: background 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            user-select: none;
        }
        /* 1行を維持したまま画面幅に応じて限界まで縮小するアクションボタン群のスタイル */
        div.responsive-action-buttons {
            font-size: clamp(0.7rem, 1.5vw + 0.2rem, 1.125rem) !important;
            flex-wrap: nowrap !important;
            max-width: 98% !important;
            width: max-content !important;
            bottom: 3.5rem !important; /* デフォルト（PC等）の位置 */
        }
        /* スマホ縦画面（幅が狭く、かつ縦長のデバイス）の場合のみ「生成・ランダム・更新」ボタンをさらに上にしっかり移動 */
        @media (max-width: 768px) and (orientation: portrait) and (hover: none) and (pointer: coarse) {
            div.responsive-action-buttons {
                bottom: 8.5rem !important; /* ボタン位置をさらに上に引き上げ */
            }
        }
        /* スマホ縦画面（幅が狭く、かつ縦長）のときのみ、カラーペイン内の要素（ロックボタン・コード・Copy）の位置を下部余白で適度に引き下げ（高くなりすぎを防止） */
        @media (max-width: 768px) and (orientation: portrait) and (hover: none) and (pointer: coarse) {
            .color-pane {
                padding-bottom: 10.5rem !important; /* パディングを縮めて要素を適度に下へ下げる */
            }
        }
        /* 境界線のリサイズハンドル */
        .resize-handle {
            position: absolute;
            right: -11px; /* 中心を境界線に合わせる */
            top: 0;
            width: 24px; /* タッチしやすいように幅を3倍に拡大 */
            height: 100%;
            cursor: col-resize;
            z-index: 10;
            touch-action: none; /* スクロール干渉を防ぐ */
        }
        @media (hover: hover) {
            .resize-handle:hover {
                background: rgba(255, 255, 255, 0.2);
            }
        }
        /* ロックボタン（文字の少し上） */
        .lock-btn {
            position: absolute;
            bottom: 48%; /* カラーコード等の少し上 */
            left: 50%;
            transform: translateX(-50%);
            padding: 4px 10px;
            border-radius: 9999px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: all 0.2s;
            z-index: 20;
        }
        .responsive-action-buttons button {
            padding-top: clamp(0.5rem, 1vw + 0.2rem, 1rem);       /* 最大値 py-4 相当 */
            padding-bottom: clamp(0.5rem, 1vw + 0.2rem, 1rem);
            padding-left: clamp(1rem, 2vw + 0.5rem, 2rem);       /* 最大値 px-8 相当 */
            padding-right: clamp(1rem, 2vw + 0.5rem, 2rem);
        }
        .responsive-action-buttons svg {
            width: clamp(1rem, 1.2vw + 0.2rem, 1.5rem);       /* 最大値 h-6 w-6 相当 */
            height: clamp(1rem, 1.2vw + 0.2rem, 1.5rem);
        }
    </style>
</head>
<body class="bg-gray-900">

    <!-- モバイル用 オーバーレイ背景 -->
    <div id="drawer-overlay" class="fixed inset-0 bg-black/60 z-40 hidden backdrop-blur-sm transition-opacity"></div>

    <!-- 編集画面 (サイドバー / モバイルドロワー) -->
    <aside id="settings-panel" class="absolute inset-y-0 left-0 w-80 h-full flex-shrink-0 flex flex-col p-6 text-white shadow-2xl z-50 transform -translate-x-full transition-transform duration-300 ease-in-out overflow-hidden">
        <!-- リアルタイム縦長グラデーションプレビュー（狭い画面時にサイドバー右縁に追従） -->
        <div id="sidebar-gradient-preview"></div>

        <div class="flex justify-between items-center mb-4 flex-shrink-0">
            <h2 class="text-xl font-bold tracking-wider drop-shadow flex items-center gap-2">
                <span class="w-3 h-3 rounded-full inline-block" style="background-color: #3B82F6;"></span>
                <span id="txt-edit-screen">編集画面</span>
            </h2>
            <div class="flex items-center gap-2">
                <button id="lang-toggle-btn" class="w-7 h-7 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-sm transition-colors cursor-pointer" title="言語切替 / Language">🇯🇵</button>
                <button id="help-btn" class="flex w-7 h-7 rounded-full bg-white/10 hover:bg-white/20 items-center justify-center text-xs font-bold transition-colors cursor-pointer" title="ショートカット一覧">?</button>
                <button id="close-drawer-btn" class="flex md:hidden w-7 h-7 rounded-full bg-white/10 hover:bg-white/20 items-center justify-center text-xs font-bold transition-colors cursor-pointer">✕</button>
            </div>
        </div>
        
        <div class="flex-1 space-y-6 overflow-y-auto pr-1">
            <!-- 色数設定 -->
            <div>
                <div class="flex justify-between items-center mb-2">
                    <label id="txt-color-count-label" class="text-xs font-semibold uppercase tracking-wider opacity-70">色数</label>
                    <span id="color-count-value" class="text-xs font-bold" style="color: #7AC3FF;">2色</span>
                </div>
                <input type="range" id="color-count-slider" min="2" max="6" value="2" step="1" class="w-full cursor-pointer">
            </div>

            <!-- ジェネレートモード -->
            <div>
                <div class="flex justify-between items-center mb-2">
                    <label id="txt-palette-category" class="text-xs font-semibold uppercase tracking-wider opacity-70">配色カテゴリ</label>
                    <button id="reset-category-btn" class="w-6 h-6 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center transition-colors cursor-pointer" title="OKLCHトーン設定をリセット">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M21 3v5h-5" />
                        </svg>
                    </button>
                </div>
                <select id="main-mode" class="w-full bg-black/40 border border-white/20 rounded-lg p-2 text-white text-sm outline-none focus:border-indigo-500 transition-colors mb-2 cursor-pointer">
                    <option value="hue_tone">① OKLCH色相トーン配色</option>
                    <option value="theory">② 色彩理論・体系配色</option>
                    <option value="image">③ イメージワード配色</option>
                </select>
                
                <select id="sub-mode" class="w-full bg-black/40 border border-white/20 rounded-lg p-2 text-white text-sm outline-none focus:border-indigo-500 transition-colors cursor-pointer mb-2">
                    <!-- 動的生成 -->
                </select>

                <!-- OKLCHトーン配色用スライダー -->
                <div id="hue-tone-settings" class="hidden w-full bg-black/40 border border-white/20 rounded-lg p-3 mb-2 space-y-4">
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label id="txt-hue-step-label" class="text-xs text-white/80">色相ステップ</label>
                            <div class="flex items-center gap-1">
                                <input type="number" id="hue-step-input" min="-180" max="180" value="60" step="1" class="w-16 bg-black/50 border border-white/20 rounded text-xs font-bold text-right outline-none focus:border-indigo-500 px-1 py-0.5" style="color: #7AC3FF;">
                                <span class="text-xs" style="color: #7AC3FF;">°</span>
                            </div>
                        </div>
                        <input type="range" id="hue-step-slider" min="-180" max="180" value="60" step="15" class="w-full cursor-pointer">
                    </div>
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label id="txt-sat-step-label" class="text-xs text-white/80">彩度ステップ</label>
                            <input type="number" id="sat-step-input" min="-1.00" max="1.00" value="0.00" step="0.01" class="w-16 bg-black/50 border border-white/20 rounded text-xs font-bold text-right outline-none focus:border-indigo-500 px-1 py-0.5" style="color: #7AC3FF;">
                        </div>
                        <input type="range" id="sat-step-slider" min="-1.0" max="1.0" value="0" step="0.05" class="w-full cursor-pointer">
                    </div>
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label id="txt-lit-step-label" class="text-xs text-white/80">明度ステップ</label>
                            <input type="number" id="lit-step-input" min="-1.00" max="1.00" value="0.00" step="0.01" class="w-16 bg-black/50 border border-white/20 rounded text-xs font-bold text-right outline-none focus:border-indigo-500 px-1 py-0.5" style="color: #7AC3FF;">
                        </div>
                        <input type="range" id="lit-step-slider" min="-1.0" max="1.0" value="0" step="0.05" class="w-full cursor-pointer">
                    </div>
                </div>
            </div>

            <!-- 全体調整 -->
            <div>
                <div class="flex justify-between items-center mb-2">
                    <label id="txt-global-adjustment" class="text-xs font-semibold uppercase tracking-wider opacity-70">調整</label>
                    <button id="reset-global-btn" class="w-6 h-6 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center transition-colors cursor-pointer" title="調整をリセット">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M21 3v5h-5" />
                        </svg>
                    </button>
                </div>
                <div class="w-full bg-black/40 border border-white/20 rounded-lg p-3 mb-2 space-y-4">
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label id="txt-global-hue-label" class="text-xs text-white/80">色相調整</label>
                            <div class="flex items-center gap-1">
                                <input type="number" id="global-hue-input" min="-180" max="180" value="0" step="1" class="w-16 bg-black/50 border border-white/20 rounded text-xs font-bold text-right outline-none focus:border-indigo-500 px-1 py-0.5" style="color: #7AC3FF;">
                                <span class="text-xs" style="color: #7AC3FF;">°</span>
                            </div>
                        </div>
                        <input type="range" id="global-hue-slider" min="-180" max="180" value="0" step="1" class="w-full cursor-pointer">
                    </div>
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label id="txt-global-sat-label" class="text-xs text-white/80">彩度調整</label>
                            <div class="flex items-center gap-1">
                                <input type="number" id="global-sat-input" min="-100" max="100" value="0" step="1" class="w-16 bg-black/50 border border-white/20 rounded text-xs font-bold text-right outline-none focus:border-indigo-500 px-1 py-0.5" style="color: #7AC3FF;">
                                <span class="text-xs" style="color: #7AC3FF;">%</span>
                            </div>
                        </div>
                        <input type="range" id="global-sat-slider" min="-100" max="100" value="0" step="1" class="w-full cursor-pointer">
                    </div>
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label id="txt-global-lit-label" class="text-xs text-white/80">明度調整</label>
                            <div class="flex items-center gap-1">
                                <input type="number" id="global-lit-input" min="-100" max="100" value="0" step="1" class="w-16 bg-black/50 border border-white/20 rounded text-xs font-bold text-right outline-none focus:border-indigo-500 px-1 py-0.5" style="color: #7AC3FF;">
                                <span class="text-xs" style="color: #7AC3FF;">%</span>
                            </div>
                        </div>
                        <input type="range" id="global-lit-slider" min="-100" max="100" value="0" step="1" class="w-full cursor-pointer">
                    </div>
                </div>
            </div>

            <!-- 表示モード -->
            <div>
                <label id="txt-display-mode" class="block text-xs font-semibold uppercase tracking-wider opacity-70 mb-2">表示モード</label>
                <div class="flex bg-black/30 p-1 rounded-xl border border-white/10">
                    <button id="mode-gradient" class="flex-1 py-2 text-xs font-semibold rounded-lg text-white shadow transition-all cursor-pointer" style="background-color: #3B82F6;">グラデーション</button>
                    <button id="mode-split" class="flex-1 py-2 text-xs font-semibold rounded-lg text-white/70 hover:text-white transition-all cursor-pointer">きっぱり分ける</button>
                </div>
            </div>

            <!-- ストック機能 -->
            <div>
                <label id="txt-stock-list" class="block text-xs font-semibold uppercase tracking-wider opacity-70 mb-2">ストック一覧 (最大20個)</label>
                <div id="stock-list" class="space-y-2">
                    <!-- JSで動的生成 -->
                </div>
            </div>
        </div>

        <!-- アクションボタン群 (機能拡張) -->
        <div class="mt-2 space-y-2 pt-3 border-t border-white/10 flex-shrink-0">
            <div class="grid grid-cols-2 gap-2">
                <button id="copy-current-css-btn" style="background-color: rgba(59, 130, 246, 0.8); border-color: rgba(59, 130, 246, 0.3);" class="py-2.5 hover:opacity-95 rounded-xl text-[11px] font-bold tracking-wider uppercase transition-colors cursor-pointer flex items-center justify-center gap-1">
                    CSSコピー
                </button>
                <button id="copy-tailwind-btn" style="background-color: rgba(59, 130, 246, 0.8); border-color: rgba(59, 130, 246, 0.3);" class="py-2.5 hover:opacity-95 rounded-xl text-[11px] font-bold tracking-wider uppercase transition-colors cursor-pointer flex items-center justify-center gap-1">
                    Tailwindコピー
                </button>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <button id="export-current-json-btn" class="py-2.5 bg-white/10 hover:bg-white/20 border border-white/20 rounded-xl text-[11px] font-bold tracking-wider uppercase transition-colors cursor-pointer flex items-center justify-center gap-1">
                    JSON出力
                </button>
                <button id="export-csv-btn" class="py-2.5 bg-white/10 hover:bg-white/20 border border-white/20 rounded-xl text-[11px] font-bold tracking-wider uppercase transition-colors cursor-pointer flex items-center justify-center gap-1">
                    CSV出力
                </button>
            </div>
        </div>
    </aside>

    <!-- メイン表示エリア -->
    <main id="main-container" class="flex-1 h-full relative flex flex-col min-w-0">
        <!-- メニュー開くボタン (PC全画面では非表示、画面幅が狭い場合やスマホ時に表示) -->
        <button id="open-drawer-btn" class="hidden absolute top-6 left-6 z-30 p-3 bg-black/40 backdrop-blur-md text-white rounded-full border border-white/20 shadow-lg hover:bg-white/20 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
        </button>

        <!-- 左上：境界線リセットボタン (ハンバーガーボタンと重ならないようにIDで位置制御) -->
        <div id="reset-widths-container" class="absolute top-6 left-8 flex items-center z-30 transition-all duration-300">
            <button id="reset-widths-btn" class="px-3 md:px-4 py-2 bg-black/40 hover:bg-black/60 backdrop-blur-md text-white font-bold text-[11px] md:text-xs tracking-wider rounded-full shadow-lg border border-white/20 transition-all hover:scale-105 cursor-pointer flex items-center gap-1.5 uppercase" title="色領域の比率を均等にリセット">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 3v5h-5" />
                </svg>
                <span id="txt-reset-widths">幅をリセット</span>
            </button>
        </div>

        <!-- 右上：履歴＆SAVEボタン -->
        <div class="absolute top-6 right-6 flex flex-col items-end gap-3 z-30">
            <div class="flex items-center gap-1 bg-black/40 backdrop-blur-md p-1 rounded-full border border-white/20 shadow-lg">
                <button id="undo-btn" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-white/20 text-white transition-colors cursor-pointer disabled:opacity-30 disabled:cursor-not-allowed" title="一つ前に戻る (Ctrl+Z)">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
                    </svg>
                </button>
                <button id="redo-btn" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-white/20 text-white transition-colors cursor-pointer disabled:opacity-30 disabled:cursor-not-allowed" title="一つ後に進む (Ctrl+Y)">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                    </svg>
                </button>
            </div>
            <button id="save-stock-btn" style="background-color: #3B82F6; border-color: rgba(59, 130, 246, 0.3);" class="px-5 py-2.5 backdrop-blur-md text-white font-bold text-xs tracking-widest rounded-full shadow-lg transition-all hover:scale-105 cursor-pointer flex items-center gap-2 uppercase">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">

                    { value: 'split_complementary', label: 'スプリットコンプリメンタリー (3色)', targetCount: 3 },
                    { value: 'tetrad', label: 'テトラード / 4等分 (4色)', targetCount: 4 },
                    { value: 'pentad', label: 'ペンタード / 5等分 (5色)', targetCount: 5 },

                ],
                image: [
                    { value: 'casual', label: 'カジュアル' },

                    { value: 'clear', label: 'クリア' },

                    { value: 'fresh_natural', label: 'フレッシュナチュラル' },
                    { value: 'elegant', label: 'エレガント' },
                    { value: 'romantic', label: 'ロマンチック' }
                ]
            }

        /**
         * 色変換 & コントラスト計算クラス (ColorMath)
         * OKLCH ↔ OKLab ↔ Linear RGB ↔ sRGB (D65) 変換 & Gamut Mapping
         */
        class ColorMath {
            static random(min, max) {
                return Math.random() * (max - min) + min;
            }

            static srgbToLinear(c) {
                c /= 255;
                return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
            }

            static linearToSrgb(c) {
                const abs = Math.max(0, c);
                const s = abs <= 0.0031308 ? 12.92 * abs : 1.055 * Math.pow(abs, 1 / 2.4) - 0.055;
                return Math.min(255, Math.max(0, Math.round(s * 255)));
            }

            static oklchToOklab(l, c, h) {
                const hRad = (h * Math.PI) / 180;
                return {
                    L: l,
                    a: c * Math.cos(hRad),
                    b: c * Math.sin(hRad)
                };
            }

            static oklabToLinearRgb(L, a, b) {
                const l_ = L + 0.3963377774 * a + 0.2158037573 * b;
                const m_ = L - 0.1055613458 * a - 0.0638541728 * b;
                const s_ = L - 0.0894841775 * a - 1.2914855480 * b;

                const l = l_ * l_ * l_;
                const m = m_ * m_ * m_;
                const s = s_ * s_ * s_;

                return [
                    +4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
                    -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
                    -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s
                ];
            }

            /**
             * OKLCH -> sRGB [r, g, b] (Gamut Mapping処理付き)
             * 二分探索(Binary Search)を用いて、正確にsRGB色域内に収まる最大彩度を計算
             */
            static oklchToRgb(l, c, h) {
                // 明度が限界値の場合は計算せずに確実な白・黒を返す
                if (l <= 0.0) return [0, 0, 0];
                if (l >= 1.0) return [255, 255, 255];

                let minC = 0;
                let maxC = Math.max(0, c);
                let currentC = maxC;
                let bestLinRgb = null;

                // バイナリサーチで表示可能な最大彩度を探索（20回で十分な精度）
                for (let i = 0; i < 20; i++) {
                    const lab = this.oklchToOklab(l, currentC, h);
                    const linRgb = this.oklabToLinearRgb(lab.L, lab.a, lab.b);
                    
                    const inGamut = linRgb[0] >= -0.001 && linRgb[0] <= 1.001 &&
                                     linRgb[1] >= -0.001 && linRgb[1] <= 1.001 &&
                                     linRgb[2] >= -0.001 && linRgb[2] <= 1.001;
                    
                    if (inGamut) {
                        bestLinRgb = linRgb;
                        minC = currentC; // さらに彩度を上げられるか試す
                    } else {
                        maxC = currentC; // 色域外なので彩度を下げる
                    }
                    currentC = (minC + maxC) / 2;
                }

                // 色域内に収まる値が一度も見つからなかった場合のフォールバック（無彩色）
                if (!bestLinRgb) {
                     const lab = this.oklchToOklab(l, 0, h);
                     bestLinRgb = this.oklabToLinearRgb(lab.L, lab.a, lab.b);
                }

                return [
                    this.linearToSrgb(bestLinRgb[0]),
                    this.linearToSrgb(bestLinRgb[1]),
                    this.linearToSrgb(bestLinRgb[2])
                ];
            }

            static rgbToHex(r, g, b) {
                return "#" + (1 << 24 | r << 16 | g << 8 | b).toString(16).slice(1).toUpperCase();
            }

            static getRelativeLuminance(r, g, b) {
                const R = this.srgbToLinear(r);
                const G = this.srgbToLinear(g);
                const B = this.srgbToLinear(b);
                return 0.2126 * R + 0.7152 * G + 0.0722 * B;
            }

            static getAccessibleTextColor(r, g, b) {
                const bgLuminance = this.getRelativeLuminance(r, g, b);
                const contrastWithWhite = (0.95 + 0.05) / (bgLuminance + 0.05);
                const contrastWithBlack = (bgLuminance + 0.05) / (0.01 + 0.05);

                return contrastWithWhite >= contrastWithBlack ? '#F9FAFB' : '#111827';
            }
            
            // RGBから正確なOKLCHを逆算 (再計算による劣化を防ぐ保護処理追加)
            static rgbToOklch(r, g, b) {
                const linRgb = [this.srgbToLinear(r), this.srgbToLinear(g), this.srgbToLinear(b)];
                
                const l = 0.4122214708 * linRgb[0] + 0.5363325363 * linRgb[1] + 0.0514459929 * linRgb[2];
                const m = 0.2119034982 * linRgb[0] + 0.6806995451 * linRgb[1] + 0.1073969566 * linRgb[2];
                const s = 0.0883024619 * linRgb[0] + 0.2817188376 * linRgb[1] + 0.6299787005 * linRgb[2];

                // 微小な負の値による NaN を回避
                const l_ = Math.cbrt(l > 0 ? l : 0);
                const m_ = Math.cbrt(m > 0 ? m : 0);
                const s_ = Math.cbrt(s > 0 ? s : 0);

                const L = 0.2104542553*l_ + 0.7936177850*m_ - 0.0040720468*s_;
                const a = 1.9779984951*l_ - 2.4285922050*m_ + 0.4505937099*s_;
                const b_ = 0.0259040371*l_ + 0.7827717662*m_ - 0.8086757660*s_;

                const C = Math.max(0, Math.sqrt(a * a + b_ * b_));
                let H = Math.atan2(b_, a) * (180 / Math.PI);
                if (H < 0) H += 360;

                return { l: L, c: C, h: H };
            }
        }

        /**
         * 配色生成ロジッククラス (PaletteGenerator)
         */
        class PaletteGenerator {
            static generate(mainMode, subMode, count, settings, baseState = null) {
                let okList = [];
                let baseH = baseState ? baseState.h : ColorMath.random(0, 360);
                let baseL = baseState ? baseState.l : ColorMath.random(0.4, 0.8);
                let baseC = baseState ? baseState.c : ColorMath.random(0.08, 0.20);

                if (mainMode === 'hue_tone') {
                    for (let i = 0; i < count; i++) {
                        let h = (baseH + settings.hueStep * i) % 360;
                        // 彩度(c)の上限制限を 0.32 から 1.0 に拡大してスライダーの強さを反映させる
                        let c = Math.max(0.0, Math.min(1.0, baseC + settings.satStep * i));
                        // 白（1.0）や黒（0.0）に到達できるように制限を緩める
                        let l = Math.max(0.0, Math.min(1.0, baseL + settings.litStep * i));
                        okList.push({ l, c, h });
                    }
                }
                else if (mainMode === 'theory') {
                    if (subMode === 'camaieu') {
                        for (let i = 0; i < count; i++) {
                            okList.push({ l: baseL + ColorMath.random(-0.03, 0.03), c: baseC + ColorMath.random(-0.02, 0.02), h: baseH + ColorMath.random(-5, 5) });
                        }
                    } else if (subMode === 'faux_camaieu') {
                        for (let i = 0; i < count; i++) {
                            okList.push({ l: baseL + ColorMath.random(-0.08, 0.08), c: baseC + ColorMath.random(-0.04, 0.04), h: baseH + ColorMath.random(-15, 15) });
                        }
                    } else if (['dyad', 'triad', 'tetrad', 'pentad', 'hexad', 'split_complementary'].includes(subMode)) {
                        // ダイアード、トライアド、スプリット等も含め、現在の「色数(count)」に合わせて360度を均等割り（または対応角）にする
                        const step = 360 / count;
                        for (let i = 0; i < count; i++) {
                            let hOffset = step * i;
                            if (subMode === 'split_complementary' && count === 3) {
                                const angles = [0, 150, 210];
                                hOffset = angles[i] || 0;
                            }
                            
                            // 人間の視覚的な偏りを軽減するための簡易的な非線形補正
                            let perceivedH = (baseH + hOffset) % 360;
                            if (perceivedH > 60 && perceivedH < 120) perceivedH -= 10; // 黄緑付近を少し寄せる
                            else if (perceivedH > 220 && perceivedH < 280) perceivedH += 10; // 青付近を少し広げる
                            
                            okList.push({ l: baseL, c: baseC, h: perceivedH });
                        }
                    } else if (subMode === 'dominant_color') {
                        for (let i = 0; i < count; i++) {
                            okList.push({ l: 0.25 + (0.65 / count) * i, c: baseC, h: baseH });
                        }
                    } else if (subMode === 'dominant_tone' || subMode === 'tone_in_tone') {
                        for (let i = 0; i < count; i++) {
                            okList.push({ l: baseL, c: baseC, h: (baseH + (360 / count) * i) % 360 });
                        }
                    } else if (subMode === 'tone_on_tone') {
                        for (let i = 0; i < count; i++) {
                            okList.push({ l: 0.20 + (0.70 / (count - 1 || 1)) * i, c: baseC, h: baseH });
                        }
                    } else if (subMode === 'tonal') {
                        const tone = CONFIG.PCCS_TONES.d;
                        for (let i = 0; i < count; i++) {
                            okList.push({ l: ColorMath.random(tone.L[0], tone.L[1]), c: ColorMath.random(tone.C[0], tone.C[1]), h: (baseH + 30 * i) % 360 });
                        }
                    } else if (subMode === 'accent_color') {
                        for (let i = 0; i < count; i++) {
                            if (i === 1) {
                                okList.push({ l: baseL, c: 0.25, h: (baseH + 180) % 360 });
                            } else {
                                okList.push({ l: baseL, c: 0.05, h: (baseH + 15 * i) % 360 });
                            }
                        }
                    }
                } 
                else if (mainMode === 'image') {
                    const imgDef = CONFIG.IMAGE_WORDS[subMode] || CONFIG.IMAGE_WORDS.casual;
                    const tone1 = CONFIG.PCCS_TONES[imgDef.toneKeys[0]] || CONFIG.PCCS_TONES.v;
                    const tone2 = CONFIG.PCCS_TONES[imgDef.toneKeys[1]] || CONFIG.PCCS_TONES.lt;

                    for (let i = 0; i < count; i++) {
                        const currentTone = (i % 2 === 0) ? tone1 : tone2;
                        let h = ColorMath.random(imgDef.hueRange[0], imgDef.hueRange[1]);
                        let l = ColorMath.random(currentTone.L[0], currentTone.L[1]);
                        let c = ColorMath.random(currentTone.C[0], currentTone.C[1]);
                        okList.push({ l, c, h });
                    }
                }

                return okList.map(ok => {
                    const rgb = ColorMath.oklchToRgb(ok.l, ok.c, ok.h);
                    return { 
                        rgb, 
                        hex: ColorMath.rgbToHex(rgb[0], rgb[1], rgb[2]), 
                        oklch: ok,
                        originalOklch: { ...ok },
                        widthRatio: 1, // 初期幅の比率
                        locked: false  // ロック状態
                    };
                });
            }
        }

        /**
         * アプリケーション状態管理 & UIコントロール (App)
         */
        class App {
            constructor() {
                this.currentColors = [];
                this.history = [];
                this.historyIndex = -1;
                this.stocks = JSON.parse(localStorage.getItem(CONFIG.STORAGE_KEY) || '[]');
                this.isSplitMode = false;
                this.touchStartX = 0;
                this.touchStartY = 0;

                this.initDOM();
                this.bindEvents();
                
                if (!this.loadState()) {
                    this.updateSubModes();
                    this.generateNewPalette(false);
                }
                this.renderStocks();
            }

            toHalfWidth(str) {
                return str.replace(/[Ａ-Ｚａ-ｚ０-９＃]/g, (s) => {
                    return String.fromCharCode(s.charCodeAt(0) - 0xFEE0);
                }).replace(/[‐－―ー]/g, '-'); // ハイフン類も必要に応じて半角に統一
             }

            getColorCountText(count) {
                const t = this.translations[this.currentLang];
                return `${count}${t.colorCountUnit}`;
            }

            initDOM() {
                this.dom = {
                    resetCategoryBtn: document.getElementById('reset-category-btn'),
                    resetGlobalBtn: document.getElementById('reset-global-btn'),
                    langToggleBtn: document.getElementById('lang-toggle-btn'),
                    mainContainer: document.getElementById('main-container'),
                    colorPanes: document.getElementById('color-panes'),
                    settingsPanel: document.getElementById('settings-panel'),
                    drawerOverlay: document.getElementById('drawer-overlay'),
                    openDrawerBtn: document.getElementById('open-drawer-btn'),
                    closeDrawerBtn: document.getElementById('close-drawer-btn'),
                    mainMode: document.getElementById('main-mode'),
                    subMode: document.getElementById('sub-mode'),
                    colorCountSlider: document.getElementById('color-count-slider'),
                    colorCountValue: document.getElementById('color-count-value'),
                    hueToneSettings: document.getElementById('hue-tone-settings'),
                    hueStepSlider: document.getElementById('hue-step-slider'),
                    hueStepInput: document.getElementById('hue-step-input'),
                    satStepSlider: document.getElementById('sat-step-slider'),
                    satStepInput: document.getElementById('sat-step-input'),

                // スライダーとインプットの同期処理を抽象化
                const setupSync = (slider, input, min, max, isFloat) => {
                    slider.addEventListener('input', (e) => {
                        input.value = isFloat ? parseFloat(e.target.value).toFixed(2) : e.target.value;
                        this.generateNewPalette(true, false);
                    });
                    slider.addEventListener('change', (e) => {
                        this.pushHistory();
                    });
                    input.addEventListener('input', (e) => {
                        let converted = this.toHalfWidth(e.target.value);
                        if (e.target.value !== converted) e.target.value = converted;
                        let val = isFloat ? parseFloat(converted) : parseInt(converted);
                        if (isNaN(val)) val = 0;
                        val = Math.max(min, Math.min(max, val));
                        slider.value = val;
                        this.generateNewPalette(true, false);
                    });
                    input.addEventListener('change', (e) => {
                        let val = isFloat ? parseFloat(e.target.value) : parseInt(e.target.value);
                        if (isNaN(val)) val = 0;
                        e.target.value = isFloat ? Math.max(min, Math.min(max, val)).toFixed(2) : Math.max(min, Math.min(max, val));
                        this.pushHistory();
                    });
                };

                // 色相・彩度・明度ステップの連動を初期化
                setupSync(this.dom.hueStepSlider, this.dom.hueStepInput, -360, 360, false);
                setupSync(this.dom.satStepSlider, this.dom.satStepInput, -1.0, 1.0, true);
                setupSync(this.dom.litStepSlider, this.dom.litStepInput, -1.0, 1.0, true);
                
                // 全体調整用スライダーの連動を初期化
                const bindGlobalSync = (slider, input, min, max) => {
                    slider.addEventListener('input', (e) => {
                        input.value = e.target.value;
                        this.applyGlobalAdjustmentsAndRender(false);
                    });
                    slider.addEventListener('change', (e) => {
                        this.pushHistory();
                    });
                    input.addEventListener('input', (e) => {
                        let converted = this.toHalfWidth(e.target.value);
                        if (e.target.value !== converted) e.target.value = converted;
                        let val = parseInt(converted);
                        if (isNaN(val)) val = 0;
                        val = Math.max(min, Math.min(max, val));
                        slider.value = val;
                        this.applyGlobalAdjustmentsAndRender(false);
                    });
                    input.addEventListener('change', (e) => {
                        let val = parseInt(e.target.value);
                        if (isNaN(val)) val = 0;
                        e.target.value = Math.max(min, Math.min(max, val));
                        this.pushHistory();
                    });
                };
                bindGlobalSync(this.dom.globalHueSlider, this.dom.globalHueInput, -180, 180);
                bindGlobalSync(this.dom.globalSatSlider, this.dom.globalSatInput, -100, 100);
                bindGlobalSync(this.dom.globalLitSlider, this.dom.globalLitInput, -100, 100);

                    // リサイズハンドルや色領域ペイン、入力欄、ボタン上でのタッチ操作時はスワイプ生成を無効化
                    if (e.target.closest('.resize-handle') || e.target.closest('.color-pane') || e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON' || e.target.closest('button')) {
                        return;
                    }
                    const deltaX = e.changedTouches[0].clientX - this.touchStartX;
                    const deltaY = e.changedTouches[0].clientY - this.touchStartY;

                    if (Math.abs(deltaX) > 50 && Math.abs(deltaX) > Math.abs(deltaY)) {
                        if (deltaX < 0) this.generateNewPalette(false);
                        else this.undo();
                    }
                }, { passive: true });
            }

            handleShortcuts(e) {
                if (!this.dom.helpModal.classList.contains('hidden')) {
                    this.dom.helpModal.classList.add('hidden');
                    return;
                }

                const activeEl = document.activeElement;
                const isInput = ['INPUT', 'SELECT', 'TEXTAREA'].includes(activeEl.tagName);

                if (isInput) {
                    if (e.ctrlKey || e.metaKey) {
                        const key = e.key.toLowerCase();
                        if (['s', 'z', 'y'].includes(key)) {
                            return;
                        }
                    }
                    return;
                }

                if (e.ctrlKey || e.metaKey) {
                    const key = e.key.toLowerCase();
                    if (key === 'z') { e.preventDefault(); this.undo(); }
                    else if (key === 'y') { e.preventDefault(); this.redo(); }
                    else if (key === 's') { e.preventDefault(); this.saveStock(); }
                    return;
                }

                if (e.code === 'Space') { e.preventDefault(); this.generateNewPalette(false); }
                else if (e.key.toLowerCase() === 'r') { e.preventDefault(); this.randomizeSettings(); this.generateNewPalette(false); }
            }

            toggleDrawer(open) {
                const preview = document.getElementById('sidebar-gradient-preview');
                if (open) {
                    this.dom.settingsPanel.classList.remove('-translate-x-full');
                    this.dom.drawerOverlay.classList.remove('hidden');
                    if (window.innerWidth <= 1200 && preview) {
                        preview.style.display = 'block';
                    }
                } else {
                    this.dom.settingsPanel.classList.add('-translate-x-full');
                    this.dom.drawerOverlay.classList.add('hidden');
                    if (preview) {
                        preview.style.display = 'none';
                    }

            setDisplayMode(split, recordHistory = true) {
                this.isSplitMode = split;
                if (split) {
                    this.dom.modeSplit.className = 'flex-1 py-2 text-xs font-semibold rounded-lg text-white shadow transition-all cursor-pointer';

                    this.dom.modeGradient.className = 'flex-1 py-2 text-xs font-semibold rounded-lg text-white shadow transition-all cursor-pointer';
